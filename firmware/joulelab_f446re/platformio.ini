; PlatformIO build of the JouleLab firmware (the Makefile builds the same files).
;
; No "framework" line on purpose: framework = stm32cube would replace this project's own
; STM32 HAL (Drivers/), startup file (startup_stm32f446xx.s) and linker script
; (STM32F446RETX_FLASH.ld) with the framework's copies. Here PlatformIO only provides the
; ARM toolchain, OpenOCD for ST-LINK upload/debug, and the build system.

[platformio]
src_dir = .
include_dir = Core/Inc

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.ldscript = STM32F446RETX_FLASH.ld
build_src_filter =
    -<*>
    +<Core/Src/>
    +<Drivers/STM32F4xx_HAL_Driver/Src/>
    +<startup_stm32f446xx.s>
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F446xx
    -ICore/Inc
    -IDrivers/STM32F4xx_HAL_Driver/Inc
    -IDrivers/CMSIS/Device/ST/STM32F4xx/Include
    -IDrivers/CMSIS/Include
    -std=gnu11
extra_scripts = pre:pio_build.py
