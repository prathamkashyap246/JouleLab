; STM32 NUCLEO-F446RE with the Arduino framework (STM32duino). Same setup()/loop()/Serial
; style as the ESP32 board. Flashed through the on-board ST-LINK.
; Serial = USART2 (PA2/PA3) = the ST-LINK virtual COM port, so no extra wiring is needed.
; The environment name must equal the board id used by the backend.

[env:nucleo_f446re_arduino]
platform = ststm32
board = nucleo_f446re
framework = arduino
; mbed = copy firmware.bin to the NOD_F446RE drive: no ST-LINK USB driver needed on Windows.
; Change to stlink once the driver (STSW-LINK009 / STM32CubeProgrammer) is installed.
upload_protocol = mbed
debug_tool = stlink
monitor_speed = 115200
